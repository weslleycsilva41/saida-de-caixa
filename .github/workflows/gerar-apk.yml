name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o projeto
        run: |
          ZIP="$(ls -1 *.zip | head -n 1)"
          echo "Usando $ZIP"
          unzip -o "$ZIP" -d projeto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Chave de assinatura (criada uma vez e guardada aqui)
        run: |
          if [ ! -f saida.keystore ]; then
            keytool -genkeypair -keystore saida.keystore -storepass saidadecaixa -keypass saidadecaixa \
              -alias saida -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Saida de Caixa, C=BR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add saida.keystore
            git commit -m "Guardar a chave de assinatura do app"
            git push
          fi
          cp saida.keystore projeto/app/saida.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar o APK
        working-directory: projeto
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp projeto/app/build/outputs/apk/release/app-release.apk SaidaDeCaixa.apk
          gh release create "versao-${{ github.run_number }}" SaidaDeCaixa.apk \
            --title "Saída de Caixa (versão ${{ github.run_number }})" \
            --notes "Toque em SaidaDeCaixa.apk para baixar e instalar no tablet."
